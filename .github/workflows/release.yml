name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Do NOT set registry-url here. That injects a placeholder
          # NODE_AUTH_TOKEN into .npmrc and makes @semantic-release/npm
          # report EINVALIDNPMTOKEN after OIDC fails. Match astro-mermaid:
          # publish via npm Trusted Publishing (OIDC) only.
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — same as astro-mermaid. Auth is OIDC Trusted
          # Publishing (permissions.id-token: write). Configure the publisher
          # on https://www.npmjs.com/package/astro-plantuml.
        run: npx semantic-release
